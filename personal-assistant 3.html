<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jim Bob</title>
<style>
  :root{
    --bg:#ffffff;
    --ink:#1a1a1a;
    --muted:#8a8a8a;
    --line:#ececec;
    --accent:#2f6fed;
    --bubble-user:#f4f6fb;
    --bubble-assistant:#ffffff;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Iowan Old Style','Georgia',serif;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .app{
    width:100%;
    max-width:720px;
    height:100vh;
    display:flex;
    flex-direction:column;
  }
  header{
    padding:28px 8px 18px;
    border-bottom:1px solid var(--line);
  }
  header .name{
    font-size:22px;
    letter-spacing:0.01em;
    font-weight:600;
  }
  header .status{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:12px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--muted);
    margin-top:4px;
    display:flex;
    align-items:center;
    gap:6px;
  }
  header .status::before{
    content:'';
    width:6px;
    height:6px;
    border-radius:50%;
    background:#2fbf71;
    display:inline-block;
  }
  .thread{
    flex:1;
    overflow-y:auto;
    padding:24px 8px;
    display:flex;
    flex-direction:column;
    gap:18px;
  }
  .msg{
    max-width:82%;
    padding:12px 16px;
    border-radius:14px;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:15px;
    line-height:1.5;
  }
  .msg.assistant{
    align-self:flex-start;
    background:var(--bubble-assistant);
    border:1px solid var(--line);
    color:var(--ink);
  }
  .msg.user{
    align-self:flex-end;
    background:var(--bubble-user);
    color:var(--ink);
  }
  .msg.pending{
    color:var(--muted);
    font-style:italic;
  }
  form{
    display:flex;
    align-items:flex-end;
    gap:10px;
    padding:14px 8px 24px;
    border-top:1px solid var(--line);
  }
  textarea{
    flex:1;
    resize:none;
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px 14px;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:15px;
    line-height:1.4;
    max-height:140px;
    outline:none;
    background:#fff;
    color:var(--ink);
  }
  textarea:focus{
    border-color:var(--accent);
  }
  button{
    border:none;
    background:var(--accent);
    color:#fff;
    width:40px;
    height:40px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex-shrink:0;
  }
  button:disabled{
    background:#c9d5f5;
    cursor:default;
  }
  button svg{width:16px;height:16px;}
  .empty{
    margin:auto;
    text-align:center;
    color:var(--muted);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:14px;
    padding:0 24px;
  }
  #lock{
    position:fixed;
    inset:0;
    background:var(--bg);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:10;
  }
  #lock .box{
    width:100%;
    max-width:280px;
    text-align:center;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }
  #lock .box .title{
    font-family:'Iowan Old Style','Georgia',serif;
    font-size:22px;
    margin-bottom:6px;
  }
  #lock .box .sub{
    font-size:13px;
    color:var(--muted);
    margin-bottom:20px;
  }
  #lock input{
    width:100%;
    padding:12px 14px;
    border:1px solid var(--line);
    border-radius:10px;
    font-size:15px;
    text-align:center;
    outline:none;
    margin-bottom:12px;
    box-sizing:border-box;
  }
  #lock input:focus{
    border-color:var(--accent);
  }
  #lock button{
    width:100%;
    border-radius:10px;
    height:42px;
    font-family:inherit;
    font-size:14px;
  }
  #lock .error{
    color:#d84343;
    font-size:12px;
    margin-top:10px;
    min-height:14px;
  }
  .app.hidden{
    display:none;
  }
</style>
</head>
<body>
<div id="lock">
  <div class="box">
    <div class="title">Jim Bob</div>
    <div class="sub">Enter passcode to continue</div>
    <input type="password" id="passcode" placeholder="Passcode" autocomplete="off">
    <button id="unlockBtn" type="button">Unlock</button>
    <div class="error" id="lockError"></div>
  </div>
</div>
<div class="app hidden" id="app">
  <header>
    <div class="name">Jim Bob</div>
    <div class="status">Ready</div>
  </header>
  <div class="thread" id="thread">
    <div class="empty" id="empty">I'm Jim Bob. Ask me anything — I can help you think through tasks, draft messages, and answer questions. (Note: this demo chats with you here; it isn't connected to your actual email or phone.)</div>
  </div>
  <form id="composer">
    <textarea id="input" rows="1" placeholder="Message..."></textarea>
    <button id="send" type="submit" aria-label="Send">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
    </button>
  </form>
</div>

<script>
const PASSCODE = "Et12367";
const lock = document.getElementById('lock');
const app = document.getElementById('app');
const passcodeInput = document.getElementById('passcode');
const unlockBtn = document.getElementById('unlockBtn');
const lockError = document.getElementById('lockError');

function tryUnlock(){
  if(passcodeInput.value === PASSCODE){
    lock.style.display = 'none';
    app.classList.remove('hidden');
    passcodeInput.value = '';
  }else{
    lockError.textContent = 'Incorrect passcode';
    passcodeInput.value = '';
    passcodeInput.focus();
  }
}

unlockBtn.addEventListener('click', tryUnlock);
passcodeInput.addEventListener('keydown', (e) => {
  if(e.key === 'Enter'){
    e.preventDefault();
    tryUnlock();
  }
});
passcodeInput.focus();

const thread = document.getElementById('thread');
const empty = document.getElementById('empty');
const form = document.getElementById('composer');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');

let history = [];

function addBubble(text, role){
  if(empty) empty.remove();
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  thread.appendChild(div);
  thread.scrollTop = thread.scrollHeight;
  return div;
}

input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 140) + 'px';
});

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if(!text) return;

  addBubble(text, 'user');
  history.push({role:'user', content: text});
  input.value = '';
  input.style.height = 'auto';
  sendBtn.disabled = true;

  const pending = addBubble('...', 'assistant pending');

  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        system: "You are Jim Bob, a helpful, concise personal assistant. Keep replies conversational and to the point.",
        messages: history
      })
    });
    const data = await response.json();
    const reply = (data.content || [])
      .filter(b => b.type === 'text')
      .map(b => b.text)
      .join('\n') || "Sorry, I couldn't generate a response.";
    pending.textContent = reply;
    pending.classList.remove('pending');
    history.push({role:'assistant', content: reply});
  }catch(err){
    pending.textContent = "Something went wrong reaching the assistant. Please try again.";
    pending.classList.remove('pending');
  }finally{
    sendBtn.disabled = false;
  }
});
</script>
</body>
</html>
